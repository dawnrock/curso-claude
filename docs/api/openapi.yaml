openapi: 3.0.3

info:
  title: Resttek API
  version: 1.0.0
  description: |
    REST API of **Resttek**, a restaurant management platform.

    ## Authentication

    Most endpoints require a JWT obtained from `POST /api/v1/auth/login` (or
    `POST /api/v1/auth/register` for clients). Send it in the header
    `Authorization: Bearer <token>`. The token payload holds the user's `id`,
    `role` and `restaurantId`.

    ## Roles

    | Role | Used from | Scope |
    | ---- | --------- | ----- |
    | `admin` | web-admin | Whole platform |
    | `manager` | web-admin, web-empleados | Their restaurant |
    | `cocinero` | web-empleados | Kitchen of their restaurant |
    | `camarero` | web-empleados | Dining room of their restaurant |
    | `cliente` | web-clientes | Their own orders |

    Each operation lists the roles allowed to call it. A valid token with a
    role that is not allowed gets `403`.

    ## Errors

    Two error shapes coexist:

    - `DomainError` (`{ error, message }`): domain errors mapped by the global
      error handler. `*NotFoundError` → `404`, `InvalidCredentialsError` →
      `401`, any other domain error → `400`, unexpected errors → `500`.
    - `SimpleError` (`{ error }`): authentication/authorization middlewares
      and the orders endpoints.

    ## Test credentials

    After `npm run seed`, every seeded user's password is their own email
    (for example `admin@resttek.com` / `admin@resttek.com`).

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: Service status
  - name: Auth
    description: Login and client self-registration
  - name: Public
    description: Unauthenticated, client-facing endpoints
  - name: Restaurants
    description: Restaurant management
  - name: Employees
    description: Platform users (employees and clients)
  - name: Dishes
    description: Restaurant menu
  - name: Ingredients
    description: Restaurant ingredient stock
  - name: Orders
    description: Orders and per-item kitchen status

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Public. Valid for every role (employees and clients). Returns a JWT
        and the authenticated user's profile.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unknown email or wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: InvalidCredentialsError
                message: Invalid credentials
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a client
      description: |
        Public. Creates a user with role `cliente` and no restaurant, and
        logs them in.
      operationId: registerClient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
      responses:
        '201':
          description: Client created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: |
            Validation error (`FirstNameRequiredError`, `LastNameRequiredError`,
            `InvalidEmailError`) or email already in use (`DuplicatedEmailError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: DuplicatedEmailError
                message: Email is already in use
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/public/restaurants:
    get:
      tags: [Public]
      summary: List all restaurants (public)
      description: Public. Used by web-clientes to pick a restaurant.
      operationId: listPublicRestaurants
      security: []
      responses:
        '200':
          description: All restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/public/restaurants/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Public]
      summary: Get a restaurant (public)
      description: Public.
      operationId: getPublicRestaurant
      security: []
      responses:
        '200':
          description: The restaurant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants:
    post:
      tags: [Restaurants]
      summary: Create a restaurant
      description: 'Roles: `admin`.'
      operationId: createRestaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '201':
          description: Restaurant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/RestaurantValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Restaurants]
      summary: List the restaurants visible to the user
      description: |
        Roles: any authenticated user.

        - `admin`: every restaurant.
        - Other roles: an array with only the user's restaurant, or `[]` if
          the user has no `restaurantId`.
      operationId: listRestaurants
      responses:
        '200':
          description: Restaurants visible to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Restaurants]
      summary: Get a restaurant
      description: 'Roles: any authenticated user.'
      operationId: getRestaurant
      responses:
        '200':
          description: The restaurant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Restaurants]
      summary: Replace a restaurant
      description: 'Roles: `admin`. Full update: every required field must be sent.'
      operationId: updateRestaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '200':
          description: Restaurant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/RestaurantValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/employees:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Employees]
      summary: List the employees of a restaurant
      description: 'Roles: `admin`. Not paginated.'
      operationId: listRestaurantEmployees
      responses:
        '200':
          description: Employees whose `restaurantId` matches (empty if the restaurant does not exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/employees:
    post:
      tags: [Employees]
      summary: Create an employee
      description: |
        Roles: `admin`. Any role can be assigned, including `admin` and
        `cliente`. A `restaurantId` that does not exist violates a foreign
        key and returns `500`.
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: |
            Validation error (`FirstNameRequiredError`, `LastNameRequiredError`,
            `InvalidEmailError`, `InvalidRoleError`) or `DuplicatedEmailError`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: InvalidRoleError
                message: 'Invalid role: chef. Must be one of: admin, manager, camarero, cocinero, cliente'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Employees]
      summary: List users
      description: 'Roles: `admin`. Paginated with `limit`/`offset`, optionally filtered by role.'
      operationId: listEmployees
      parameters:
        - name: limit
          in: query
          description: Maximum number of results. Invalid or `0` values fall back to the default.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: role
          in: query
          description: Return only users with this role (exact, lowercase match)
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Employees]
      summary: Get a user
      description: 'Roles: `admin`.'
      operationId: getEmployee
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DomainError:
      type: object
      description: Domain error returned by the global error handler.
      required: [error, message]
      properties:
        error:
          type: string
          description: Error class name
          example: RestaurantNotFoundError
        message:
          type: string
          example: Restaurant not found

    SimpleError:
      type: object
      description: Error returned by the auth middlewares and the orders endpoints.
      required: [error]
      properties:
        error:
          type: string
          example: 'Unauthorized: No token provided'

    Role:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]

    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
      description: Case-insensitive on input; always returned in lowercase.

    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
      description: Case-insensitive on input; always returned in lowercase.

    OrderItemStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
      description: Case-insensitive on input; always returned in lowercase.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@resttek.com
        password:
          type: string
          format: password
          example: admin@resttek.com

    RegisterClientRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Lucía
        lastName:
          type: string
          example: Martín
        email:
          type: string
          format: email
          example: lucia@example.com
        password:
          type: string
          format: password
          example: secret123

    AuthResponse:
      type: object
      required: [token, employee]
      properties:
        token:
          type: string
          description: JWT with `id`, `role` and `restaurantId` in its payload
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        employee:
          $ref: '#/components/schemas/Employee'

    Employee:
      type: object
      description: Platform user (employee or client). Never includes the password hash.
      required: [id, firstName, lastName, email, role, restaurantId]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: Admin
        lastName:
          type: string
          example: RestTek
        email:
          type: string
          format: email
          example: admin@resttek.com
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          nullable: true
          description: Restaurant the user works at; `null` for `admin` and `cliente`.
          example: null

    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: López
        email:
          type: string
          format: email
          example: ana@resttek.com
        password:
          type: string
          format: password
          example: secret123
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          nullable: true
          default: null
          example: rest-1

    RestaurantInput:
      type: object
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name:
          type: string
          example: La Tasca de Pepe
        address:
          type: string
          example: Calle Mayor 1, Madrid
        email:
          type: string
          format: email
          example: tasca@resttek.com
        phone:
          type: string
          pattern: '^\+?[\d\s\-()]{7,20}$'
          example: '+34 911 222 333'
        ownerFirstName:
          type: string
          example: Pepe
        ownerLastName:
          type: string
          example: García
        logoUrl:
          type: string
          nullable: true
          default: null
          example: https://example.com/logo.png

    Restaurant:
      allOf:
        - type: object
          required: [id, createdAt, updatedAt, logoUrl]
          properties:
            id:
              type: string
              example: rest-1
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/RestaurantInput'

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: string

    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Restaurant identifier
      schema:
        type: string
        example: rest-1

  responses:
    BadRequest:
      description: Validation or domain error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'

    RestaurantValidationError:
      description: |
        Validation error: `RestaurantNameRequiredError`,
        `RestaurantAddressRequiredError`, `OwnerFirstNameRequiredError`,
        `OwnerLastNameRequiredError`, `InvalidEmailError` or `InvalidPhoneError`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: InvalidPhoneError
            message: Invalid phone format

    Unauthorized:
      description: Missing, malformed or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Unauthorized: Invalid token'

    Forbidden:
      description: The user's role is not allowed to call this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Forbidden: Insufficient permissions'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'

    InternalError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: InternalServerError
            message: Something went wrong

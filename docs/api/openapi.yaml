openapi: 3.0.3

info:
  title: Resttek API
  version: 1.0.0
  description: |
    REST API of **Resttek**, a restaurant management platform.

    ## Authentication

    Most endpoints require a JWT obtained from `POST /api/v1/auth/login` (or
    `POST /api/v1/auth/register` for clients). Send it in the header
    `Authorization: Bearer <token>`. The token payload holds the user's `id`,
    `role` and `restaurantId`.

    ## Roles

    | Role | Used from | Scope |
    | ---- | --------- | ----- |
    | `admin` | web-admin | Whole platform |
    | `manager` | web-admin, web-empleados | Their restaurant |
    | `cocinero` | web-empleados | Kitchen of their restaurant |
    | `camarero` | web-empleados | Dining room of their restaurant |
    | `cliente` | web-clientes | Their own orders |

    Each operation lists the roles allowed to call it. A valid token with a
    role that is not allowed gets `403`.

    ## Errors

    Two error shapes coexist:

    - `DomainError` (`{ error, message }`): domain errors mapped by the global
      error handler. `*NotFoundError` → `404`, `InvalidCredentialsError` →
      `401`, any other domain error → `400`, unexpected errors → `500`.
    - `SimpleError` (`{ error }`): authentication/authorization middlewares
      and the orders endpoints.

    ## Test credentials

    After `npm run seed`, every seeded user's password is their own email
    (for example `admin@resttek.com` / `admin@resttek.com`).

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: Service status
  - name: Auth
    description: Login and client self-registration
  - name: Public
    description: Unauthenticated, client-facing endpoints
  - name: Restaurants
    description: Restaurant management
  - name: Employees
    description: Platform users (employees and clients)
  - name: Dishes
    description: Restaurant menu
  - name: Ingredients
    description: Restaurant ingredient stock
  - name: Orders
    description: Orders and per-item kitchen status

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: |
        Public. Valid for every role (employees and clients). Returns a JWT
        and the authenticated user's profile.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unknown email or wrong password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: InvalidCredentialsError
                message: Invalid credentials
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a client
      description: |
        Public. Creates a user with role `cliente` and no restaurant, and
        logs them in.
      operationId: registerClient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterClientRequest'
      responses:
        '201':
          description: Client created and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: |
            Validation error (`FirstNameRequiredError`, `LastNameRequiredError`,
            `InvalidEmailError`) or email already in use (`DuplicatedEmailError`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: DuplicatedEmailError
                message: Email is already in use
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/public/restaurants:
    get:
      tags: [Public]
      summary: List all restaurants (public)
      description: Public. Used by web-clientes to pick a restaurant.
      operationId: listPublicRestaurants
      security: []
      responses:
        '200':
          description: All restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/public/restaurants/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Public]
      summary: Get a restaurant (public)
      description: Public.
      operationId: getPublicRestaurant
      security: []
      responses:
        '200':
          description: The restaurant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants:
    post:
      tags: [Restaurants]
      summary: Create a restaurant
      description: 'Roles: `admin`.'
      operationId: createRestaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '201':
          description: Restaurant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/RestaurantValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Restaurants]
      summary: List the restaurants visible to the user
      description: |
        Roles: any authenticated user.

        - `admin`: every restaurant.
        - Other roles: an array with only the user's restaurant, or `[]` if
          the user has no `restaurantId`.
      operationId: listRestaurants
      responses:
        '200':
          description: Restaurants visible to the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Restaurants]
      summary: Get a restaurant
      description: 'Roles: any authenticated user.'
      operationId: getRestaurant
      responses:
        '200':
          description: The restaurant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Restaurants]
      summary: Replace a restaurant
      description: 'Roles: `admin`. Full update: every required field must be sent.'
      operationId: updateRestaurant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantInput'
      responses:
        '200':
          description: Restaurant updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/RestaurantValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/employees:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Employees]
      summary: List the employees of a restaurant
      description: 'Roles: `admin`. Not paginated.'
      operationId: listRestaurantEmployees
      responses:
        '200':
          description: Employees whose `restaurantId` matches (empty if the restaurant does not exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/employees:
    post:
      tags: [Employees]
      summary: Create an employee
      description: |
        Roles: `admin`. Any role can be assigned, including `admin` and
        `cliente`. A `restaurantId` that does not exist violates a foreign
        key and returns `500`.
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '400':
          description: |
            Validation error (`FirstNameRequiredError`, `LastNameRequiredError`,
            `InvalidEmailError`, `InvalidRoleError`) or `DuplicatedEmailError`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainError'
              example:
                error: InvalidRoleError
                message: 'Invalid role: chef. Must be one of: admin, manager, camarero, cocinero, cliente'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Employees]
      summary: List users
      description: 'Roles: `admin`. Paginated with `limit`/`offset`, optionally filtered by role.'
      operationId: listEmployees
      parameters:
        - name: limit
          in: query
          description: Maximum number of results. Invalid or `0` values fall back to the default.
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: offset
          in: query
          description: Number of results to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: role
          in: query
          description: Return only users with this role (exact, lowercase match)
          schema:
            $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/employees/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Employees]
      summary: Get a user
      description: 'Roles: `admin`.'
      operationId: getEmployee
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/public/restaurants/{restaurantId}/dishes:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Public]
      summary: List the available dishes of a restaurant (public)
      description: Public. Only dishes with `available = true`. Used by web-clientes to show the menu.
      operationId: listPublicDishes
      security: []
      responses:
        '200':
          description: Available dishes (empty if the restaurant does not exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/dishes:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Dishes]
      summary: Create a dish
      description: 'Roles: `admin`, `manager`.'
      operationId: createDish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishInput'
      responses:
        '201':
          description: Dish created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/DishValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Dishes]
      summary: List the dishes of a restaurant
      description: 'Roles: `admin`, `manager`, `camarero`, `cocinero`. Includes unavailable dishes.'
      operationId: listDishes
      responses:
        '200':
          description: All the restaurant's dishes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/dishes/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Dishes]
      summary: Get a dish
      description: |
        Roles: `admin`, `manager`, `camarero`, `cocinero`. The dish is looked
        up by `id` only; `restaurantId` is not checked.
      operationId: getDish
      responses:
        '200':
          description: The dish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Dishes]
      summary: Replace a dish
      description: |
        Roles: `admin`, `manager`. Full update: send every field, including
        `available`. `ingredients` defaults to `[]`, so omitting it removes
        all of the dish's ingredients.
      operationId: updateDish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DishInput'
      responses:
        '200':
          description: Dish updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dish'
        '400':
          $ref: '#/components/responses/DishValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Dishes]
      summary: Delete a dish
      description: 'Roles: `admin`, `manager`.'
      operationId: deleteDish
      responses:
        '204':
          description: Dish deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/ingredients:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Ingredients]
      summary: Create an ingredient
      description: 'Roles: `admin`.'
      operationId: createIngredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIngredientRequest'
      responses:
        '201':
          description: Ingredient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/IngredientValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Ingredients]
      summary: List the ingredients of a restaurant
      description: 'Roles: `admin`, `manager`, `cocinero`.'
      operationId: listIngredients
      responses:
        '200':
          description: All the restaurant's ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/restaurants/{restaurantId}/ingredients/{id}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Ingredients]
      summary: Get an ingredient
      description: |
        Roles: `admin`, `manager`, `cocinero`. The ingredient is looked up by
        `id` only; `restaurantId` is not checked.
      operationId: getIngredient
      responses:
        '200':
          description: The ingredient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Ingredients]
      summary: Replace an ingredient
      description: 'Roles: `admin`. Full update: every field is required.'
      operationId: updateIngredient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIngredientRequest'
      responses:
        '200':
          description: Ingredient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ingredient'
        '400':
          $ref: '#/components/responses/IngredientValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Ingredients]
      summary: Delete an ingredient
      description: 'Roles: `admin`.'
      operationId: deleteIngredient
      responses:
        '204':
          description: Ingredient deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create an order
      description: |
        Roles: any authenticated user (no role check). The caller's user id is
        stored as `clientId`.

        Each requested item is expanded into `quantity` items with
        `quantity = 1`, so every unit can be tracked separately in the
        kitchen. All items start as `pendiente`.
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created (items without dish details)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Any error while creating the order, with its message (e.g. missing `restaurantId` or `items`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
              example:
                error: Restaurant ID is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /api/v1/orders/active:
    get:
      tags: [Orders]
      summary: List the active orders of a restaurant
      description: |
        Roles: any authenticated user (no role check). Polled by web-empleados.
        An order is active while at least one of its items is not
        `entregado`. Sorted by `createdAt`, oldest first. Items include dish
        details; `restaurantName` and `restaurantLogoUrl` are not included.
      operationId: listActiveOrders
      parameters:
        - name: restaurantId
          in: query
          required: true
          schema:
            type: string
            example: rest-1
      responses:
        '200':
          description: Active orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          description: '`restaurantId` is missing'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
              example:
                error: restaurantId is required
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /api/v1/orders/mine:
    get:
      tags: [Orders]
      summary: List the caller's orders
      description: |
        Roles: any authenticated user (used by `cliente`). Orders whose
        `clientId` is the caller's id, newest first, with restaurant and dish
        details.
      operationId: listMyOrders
      responses:
        '200':
          description: The caller's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /api/v1/orders/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Orders]
      summary: Get an order
      description: |
        Roles: any authenticated user (no role or ownership check). Includes
        restaurant and dish details.
      operationId: getOrder
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
              example:
                error: Order not found
        '500':
          $ref: '#/components/responses/OrderInternalError'

  /api/v1/orders/{orderId}/items/{itemId}/status:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: itemId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Orders]
      summary: Update the status of an order item
      description: |
        Roles: any authenticated user (no role check). Used by the kitchen
        (`preparando`, `listo`) and the dining room (`entregado`). Any
        transition is accepted.
      operationId: updateOrderItemStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderItemStatusRequest'
      responses:
        '204':
          description: Status updated
        '400':
          description: Order or item not found, or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleError'
              example:
                error: 'Estado inválido: servido. Debe ser uno de: pendiente, preparando, listo, entregado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/OrderInternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DomainError:
      type: object
      description: Domain error returned by the global error handler.
      required: [error, message]
      properties:
        error:
          type: string
          description: Error class name
          example: RestaurantNotFoundError
        message:
          type: string
          example: Restaurant not found

    SimpleError:
      type: object
      description: Error returned by the auth middlewares and the orders endpoints.
      required: [error]
      properties:
        error:
          type: string
          example: 'Unauthorized: No token provided'

    Role:
      type: string
      enum: [admin, manager, camarero, cocinero, cliente]

    DishCategory:
      type: string
      enum: [entrante, principal, postre, bebida]
      description: Case-insensitive on input; always returned in lowercase.

    IngredientUnit:
      type: string
      enum: [kg, g, l, ml, unidad]
      description: Case-insensitive on input; always returned in lowercase.

    OrderItemStatus:
      type: string
      enum: [pendiente, preparando, listo, entregado]
      description: Case-insensitive on input; always returned in lowercase.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@resttek.com
        password:
          type: string
          format: password
          example: admin@resttek.com

    RegisterClientRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          example: Lucía
        lastName:
          type: string
          example: Martín
        email:
          type: string
          format: email
          example: lucia@example.com
        password:
          type: string
          format: password
          example: secret123

    AuthResponse:
      type: object
      required: [token, employee]
      properties:
        token:
          type: string
          description: JWT with `id`, `role` and `restaurantId` in its payload
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        employee:
          $ref: '#/components/schemas/Employee'

    Employee:
      type: object
      description: Platform user (employee or client). Never includes the password hash.
      required: [id, firstName, lastName, email, role, restaurantId]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: Admin
        lastName:
          type: string
          example: RestTek
        email:
          type: string
          format: email
          example: admin@resttek.com
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          nullable: true
          description: Restaurant the user works at; `null` for `admin` and `cliente`.
          example: null

    CreateEmployeeRequest:
      type: object
      required: [firstName, lastName, email, password, role]
      properties:
        firstName:
          type: string
          example: Ana
        lastName:
          type: string
          example: López
        email:
          type: string
          format: email
          example: ana@resttek.com
        password:
          type: string
          format: password
          example: secret123
        role:
          $ref: '#/components/schemas/Role'
        restaurantId:
          type: string
          nullable: true
          default: null
          example: rest-1

    RestaurantInput:
      type: object
      required: [name, address, email, phone, ownerFirstName, ownerLastName]
      properties:
        name:
          type: string
          example: La Tasca de Pepe
        address:
          type: string
          example: Calle Mayor 1, Madrid
        email:
          type: string
          format: email
          example: tasca@resttek.com
        phone:
          type: string
          pattern: '^\+?[\d\s\-()]{7,20}$'
          example: '+34 911 222 333'
        ownerFirstName:
          type: string
          example: Pepe
        ownerLastName:
          type: string
          example: García
        logoUrl:
          type: string
          nullable: true
          default: null
          example: https://example.com/logo.png

    Restaurant:
      allOf:
        - type: object
          required: [id, createdAt, updatedAt, logoUrl]
          properties:
            id:
              type: string
              example: rest-1
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        - $ref: '#/components/schemas/RestaurantInput'

    DishIngredient:
      type: object
      required: [ingredientId, quantity]
      properties:
        ingredientId:
          type: string
          format: uuid
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Amount used per dish, in the ingredient's unit
          example: 0.3

    DishInput:
      type: object
      required: [name, price, category]
      properties:
        name:
          type: string
          example: Tortilla de patatas
        description:
          type: string
          nullable: true
          default: null
          example: Con cebolla
        price:
          type: number
          exclusiveMinimum: true
          minimum: 0
          example: 12.5
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
          default: true
        ingredients:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/DishIngredient'

    Dish:
      type: object
      required: [id, name, description, price, category, available, restaurantId, ingredients, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Tortilla de patatas
        description:
          type: string
          nullable: true
          example: Con cebolla
        price:
          type: number
          example: 12.5
        category:
          $ref: '#/components/schemas/DishCategory'
        available:
          type: boolean
          example: true
        restaurantId:
          type: string
          example: rest-1
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/DishIngredient'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateIngredientRequest:
      type: object
      required: [name, unit]
      properties:
        name:
          type: string
          example: Patata
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
          default: 0
          example: 25

    UpdateIngredientRequest:
      type: object
      required: [name, unit, currentStock]
      properties:
        name:
          type: string
          example: Patata
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          minimum: 0
          example: 20

    Ingredient:
      type: object
      required: [id, name, unit, currentStock, restaurantId, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Patata
        unit:
          $ref: '#/components/schemas/IngredientUnit'
        currentStock:
          type: number
          example: 25
        restaurantId:
          type: string
          example: rest-1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
          example: rest-1
        tableId:
          type: string
          nullable: true
          default: null
          example: mesa-4
        items:
          type: array
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                example: 2
              notes:
                type: string
                nullable: true
                example: Sin cebolla

    UpdateOrderItemStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderItemStatus'

    OrderItem:
      type: object
      required: [id, dishId, quantity, notes, status]
      properties:
        id:
          type: string
          format: uuid
        dishId:
          type: string
          format: uuid
        quantity:
          type: integer
          description: Always `1` (see `POST /api/v1/orders`)
          example: 1
        notes:
          type: string
          nullable: true
          example: Sin cebolla
        status:
          $ref: '#/components/schemas/OrderItemStatus'
        dishName:
          type: string
          nullable: true
          description: Only in read operations
          example: Tortilla de patatas
        dishPrice:
          type: number
          nullable: true
          description: Only in read operations
          example: 12.5
        dishCategory:
          type: string
          enum: [entrante, principal, postre, bebida, null]
          nullable: true
          description: Only in read operations (see `DishCategory`)
          example: principal

    Order:
      type: object
      required: [id, restaurantId, tableId, clientId, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          example: rest-1
        tableId:
          type: string
          nullable: true
          example: mesa-4
        clientId:
          type: string
          format: uuid
          nullable: true
          description: Id of the user who created the order
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        restaurantName:
          type: string
          nullable: true
          description: 'Only in `GET /api/v1/orders/{id}` and `GET /api/v1/orders/mine`'
          example: Restaurante El Gourmet
        restaurantLogoUrl:
          type: string
          nullable: true
          description: 'Only in `GET /api/v1/orders/{id}` and `GET /api/v1/orders/mine`'

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: string

    RestaurantId:
      name: restaurantId
      in: path
      required: true
      description: Restaurant identifier
      schema:
        type: string
        example: rest-1

  responses:
    RestaurantValidationError:
      description: |
        Validation error: `RestaurantNameRequiredError`,
        `RestaurantAddressRequiredError`, `OwnerFirstNameRequiredError`,
        `OwnerLastNameRequiredError`, `InvalidEmailError` or `InvalidPhoneError`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: InvalidPhoneError
            message: Invalid phone format

    DishValidationError:
      description: |
        Validation error: `DishNameRequiredError`, `InvalidPriceError` or
        `InvalidCategoryError`. An invalid item in `ingredients` (empty
        `ingredientId` or `quantity <= 0`) currently returns `500`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: InvalidCategoryError
            message: 'Invalid category: pasta. Must be one of: entrante, principal, postre, bebida'

    IngredientValidationError:
      description: 'Validation error: `IngredientNameRequiredError`, `InvalidUnitError` or `NegativeStockError`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: InvalidUnitError
            message: 'Invalid unit: tazas. Must be one of: kg, g, l, ml, unidad'

    OrderInternalError:
      description: Unexpected error in the orders endpoints
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: Internal Server Error

    Unauthorized:
      description: Missing, malformed or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Unauthorized: Invalid token'

    Forbidden:
      description: The user's role is not allowed to call this operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SimpleError'
          example:
            error: 'Forbidden: Insufficient permissions'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'

    InternalError:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DomainError'
          example:
            error: InternalServerError
            message: Something went wrong
